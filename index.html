<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBOR · Stacks Bitcoin Offered Rate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2ED; --paper-2:#E7E9E1;
  --ink:#131A1F; --ink-soft:#5C646B;
  --rule:#CBCFC4; --rule-soft:#DEE1D8;
  --accent:#1D4E6B; --up:#2E6A4E; --down:#A2452F;
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;font-feature-settings:"tnum" 1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header{border-bottom:1px solid var(--rule)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0;flex-wrap:wrap}
.head-id{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.mark{font-weight:600;font-size:22px;letter-spacing:.16em}
.mark span{color:var(--accent)}
.fullname{font-size:clamp(17px,2vw,21px);font-weight:450;letter-spacing:-.005em}
.head-right{display:flex;align-items:center;gap:12px}
.tag{border:1px solid var(--rule);padding:2px 8px;border-radius:2px;font-size:12px;color:var(--ink-soft)}
.lang{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lang button{font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.04em;background:none;border:none;color:var(--ink-soft);padding:5px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.xlink{color:var(--ink-soft);display:inline-flex;padding:5px;border:1px solid var(--rule);border-radius:2px;transition:color .15s,border-color .15s}
.xlink:hover{color:var(--ink);border-color:var(--ink)}
.xlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.intro{border-bottom:1px solid var(--rule);background:var(--paper-2)}
.intro-in{padding:24px 28px 26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 40px;align-items:start}
.intro h2{grid-column:1 / -1;font-size:clamp(18px,2.2vw,22px);font-weight:500;letter-spacing:-.01em;margin-bottom:4px}
.intro p{font-size:14.5px;color:var(--ink-soft);max-width:52ch;line-height:1.5}
@media (max-width:720px){.intro-in{grid-template-columns:1fr;padding:20px 20px 22px;gap:8px}}
.switch{display:flex;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.switch button{font:inherit;font-size:15px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);padding:14px 0;margin-right:32px;cursor:pointer;text-align:left}
.switch button b{font-weight:500;color:inherit}
.switch button small{display:block;font-size:12.5px;font-weight:400;opacity:.85}
.switch button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.switch button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fixing{padding:46px 0 42px;border-bottom:1px solid var(--rule)}
.fixing h1{font-size:clamp(19px,2.4vw,25px);font-weight:450;line-height:1.35;max-width:38ch}
.stamp{margin-top:10px;color:var(--ink-soft);font-size:13.5px}
.rates{display:grid;grid-template-columns:1fr 1fr;margin-top:34px;border:1px solid var(--rule);
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px)}
.rate{padding:26px 26px 22px}
.rate + .rate{border-left:1px solid var(--rule)}
.rate-k{font-size:13.5px;color:var(--ink-soft)}
.rate-v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(50px,9.4vw,98px);line-height:.98;font-weight:500;letter-spacing:-.03em;margin-top:6px;color:var(--accent)}
.rate-v .pct{font-size:.42em;font-weight:400;letter-spacing:0;margin-left:.08em;color:var(--ink-soft)}
.delta{margin-top:10px;font-size:14px;font-family:"IBM Plex Mono",monospace;color:var(--ink-soft)}

section{padding:44px 0;border-bottom:1px solid var(--rule)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:17px;font-weight:600}
.sec-h p{color:var(--ink-soft);font-size:13.5px;max-width:56ch}
.ranges{display:flex;gap:4px}
.ranges button{font:inherit;font-size:13px;background:none;border:1px solid var(--rule);color:var(--ink-soft);padding:4px 11px;border-radius:2px;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ranges button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chart{width:100%;height:280px;display:block;border:1px solid var(--rule)}
.legend{display:flex;gap:22px;margin-top:12px;font-size:13.5px;color:var(--ink-soft);flex-wrap:wrap}
.swatch{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:7px}

table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:500;font-size:13.5px;color:var(--ink-soft);padding:0 12px 9px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
th.r,td.r{text-align:right;padding-right:0}
td{padding:13px 12px 13px 0;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
.venue{font-weight:500}
.asset{color:var(--ink-soft);font-size:13px;margin-left:8px}
.bar{position:relative;display:block;width:100%;max-width:150px;height:7px;background:var(--paper-2);margin-left:auto}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);display:block}
.bar.phase i{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 6px)}
.poxbox{border:1px solid var(--rule);padding:24px 26px 22px;
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px)}
.poxk{font-size:13.5px;color:var(--ink-soft)}
.poxv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(46px,8vw,84px);line-height:.98;font-weight:500;letter-spacing:-.03em;margin-top:6px;color:var(--accent)}
.poxv .pct{font-size:.42em;font-weight:400;letter-spacing:0;margin-left:.08em;color:var(--ink-soft)}
.coverage{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;letter-spacing:.01em}
.foot-note{margin-top:16px;color:var(--ink-soft);font-size:13.5px;max-width:70ch}

.method{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.method p{max-width:58ch;color:var(--ink-soft);margin-bottom:14px}
.method p strong{color:var(--ink);font-weight:500}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13.5px;background:var(--paper-2);border-left:2px solid var(--accent);padding:14px 16px;color:var(--ink);margin:6px 0 18px}

.signup{display:flex;gap:10px;flex-wrap:wrap;max-width:520px}
.signup input[type=email]{flex:1 1 260px;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:2px}
.signup input[type=email]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.signup button{font:inherit;font-size:15px;font-weight:500;padding:11px 22px;cursor:pointer;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px}
.signup button:hover{background:var(--accent);border-color:var(--accent)}
.signup button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hp,.sr{position:absolute;left:-9999px}

footer{padding:36px 0 64px;color:var(--ink-soft);font-size:13.5px}
.oracle{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border:1px solid var(--rule);padding:16px 18px;margin-bottom:22px}
.oracle code{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink)}
.oracle code a{color:var(--accent);text-decoration:none}
.oracle code a:hover{text-decoration:underline}
a{color:var(--accent)}

@media (max-width:720px){
  .rates{grid-template-columns:1fr}
  .rate + .rate{border-left:none;border-top:1px solid var(--rule)}
  .method{grid-template-columns:1fr;gap:8px}
  .wrap{padding:0 20px}
  .switch button{margin-right:22px;font-size:14px}
  th.hide-sm,td.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="head-id">
      <div class="mark">S<span>·</span>B<span>·</span>O<span>·</span>R</div>
      <div class="fullname" id="t-fullname"></div>
    </div>
    <div class="head-right">
      <div class="lang" id="lang" role="group" aria-label="Language / Idioma">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="pt" aria-pressed="false">PT</button>
      </div>
      <a class="xlink" href="https://x.com/sborindex" aria-label="SBOR on X">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="intro">
  <div class="wrap intro-in">
    <h2 id="t-introH"></h2>
    <p id="t-introP"></p>
    <p id="t-introUse"></p>
  </div>
</div>

<div class="wrap">
  <nav class="switch" id="switch" aria-label="Index currency"></nav>
</div>

<main>
  <div class="wrap">

    <div class="fixing">
      <h1 id="hl"></h1>
      <p class="stamp" id="stamp"></p>
      <div class="rates">
        <div class="rate">
          <div class="rate-k" id="t-borrow-k"></div>
          <div class="rate-v"><span class="num" id="borrowVal">0.00</span><span class="pct">%</span></div>
          <div class="delta" id="borrowDelta"></div>
        </div>
        <div class="rate">
          <div class="rate-k" id="t-supply-k"></div>
          <div class="rate-v"><span class="num" id="supplyVal">0.00</span><span class="pct">%</span></div>
          <div class="delta" id="supplyDelta"></div>
        </div>
      </div>
    </div>

    <section id="pox-sec" hidden>
      <div class="sec-h">
        <div>
          <h2 id="t-poxH"></h2>
          <p id="t-poxP"></p>
        </div>
      </div>
      <div class="poxbox">
        <div class="poxk">SBOR-POX</div>
        <div class="poxv"><span class="num" id="poxVal">0.00</span><span class="pct">%</span></div>
        <div class="coverage" id="poxMeta" style="margin:10px 0 0"></div>
      </div>
    </section>

    <section>
      <div class="sec-h">
        <div>
          <h2 id="t-hist-h"></h2>
          <p id="t-hist-p"></p>
        </div>
        <div class="ranges" role="group" aria-label="Range">
          <button data-range="30" aria-pressed="false">30D</button>
          <button data-range="90" aria-pressed="true">90D</button>
          <button data-range="365" aria-pressed="false">1Y</button>
        </div>
      </div>
      <svg class="chart" id="chart" viewBox="0 0 1120 280" preserveAspectRatio="none" role="img" aria-label="Rate history"></svg>
      <p class="coverage" id="chartNote" style="margin:12px 0 0"></p>
      <div class="legend" id="legend"></div>
    </section>

    <section>
      <div class="sec-h">
        <div>
          <h2 id="t-cons-h"></h2>
          <p id="consNote"></p>
        </div>
      </div>
      <p class="coverage" id="coverage"></p>
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="foot-note" id="t-cons-foot"></p>
    </section>

    <section>
      <div class="sec-h"><div><h2 id="t-method-h"></h2></div></div>
      <div class="method">
        <div id="method-a"></div>
        <div id="method-b"></div>
      </div>
      <p class="foot-note" id="t-sources"></p>
    </section>

    <section id="signup">
      <div class="sec-h">
        <div>
          <h2 id="t-signup-h"></h2>
          <p id="t-signup-p"></p>
        </div>
      </div>
      <form class="signup" name="weekly" method="POST" action="/success.html" data-netlify="true" netlify-honeypot="company">
        <input type="hidden" name="form-name" value="weekly">
        <p class="hp"><label>Leave blank <input name="company" tabindex="-1"></label></p>
        <label class="sr" for="email">Email</label>
        <input id="email" type="email" name="email" required autocomplete="email">
        <button type="submit" id="t-signup-btn"></button>
      </form>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <div class="oracle">
      <div id="t-oracle-a"></div>
      <div id="t-oracle-b"></div>
    </div>
    <p id="t-disclaimer"></p>
  </div>
</footer>

    "<strong>Instrumentos, não ativos nativos.</strong> Cada taxa se refere ao ativo que é de fato emprestado na Stacks. O SBOR-BTC mede o sBTC, não o bitcoin nativo, e o SBOR-USD mede USDCx e USDh, não dólares bancários. Cada um carrega risco de emissão, paridade ou ponte que o ativo original não tem.",
    "<strong>Rendimento do protocolo fica de fora.</strong> Alguns ativos rendem por si mesmos, e não pelo empréstimo. O sBTC carrega rendimento do protocolo Bitcoin via dual stacking, e o stSTX carrega rendimento de staking PoX administrado pela StackingDAO. Esse rendimento pertence ao ativo, não ao empréstimo, então nunca entra no fixing.",
    "<strong>Entrada gradual.</strong> Um mercado recém-elegível entra com peso zero e sobe linearmente até o peso cheio ao longo de 30 dias, de modo que incluir uma plataforma nunca provoca um salto na taxa.",
    "<strong>Médias móveis.</strong> Uma média só é publicada quando existe a janela completa de dados. Uma média de 200 dias aparece no dia 200, não antes.",
    "<strong>Dados indisponíveis.</strong> Se o estado de um mercado não puder ser lido, seu peso é zero naquele fixing e a omissão fica registrada.",
    "<strong>Revisões.</strong> Fixings publicados nunca são reescritos. Correções aparecem como um novo fixing, com nota."
  ],
  signupH:"Relatório semanal de taxas",
  signupP:"Segunda de manhã. Onde cada moeda fechou, como o spread se moveu na semana, a linha de tendência e qualquer mudança nos componentes. Um e-mail, nada além disso.",
  signupPlaceholder:"voce@fundo.com", signupBtn:"Assinar",
  oracleA:'Dados · legíveis por máquina, sem necessidade de chave<br><code><a href="/api/latest.json">/api/latest.json</a> · <a href="/api/history.json">/api/history.json</a> · <a href="/latest.txt">/latest.txt</a> · <a href="/llms.txt">/llms.txt</a></code>',
  oracleB:"Livre para referência. Não é preciso pedir permissão.<br>sbor.xyz · sbor.btc · sbor.stx",
  disclaimer:"O SBOR é publicado como bem público. É uma estatística, não um investimento: ninguém recebe SBOR. As taxas são lidas do estado dos contratos na mainnet da Stacks. Dados de profundidade da DefiLlama."
}};

const INDEX_COPY = {
  USD:{ en:{ sub:"dollar markets", headline:"The dollar cost of money on Stacks.",
             note:"Weights track lending depth in each dollar market. USDCx and USDh are treated as one currency." },
        pt:{ sub:"mercados em dólar", headline:"O custo do dinheiro em dólar na Stacks.",
             note:"Os pesos acompanham a profundidade de crédito de cada mercado em dólar. USDCx e USDh são tratados como uma só moeda." }},
  BTC:{ en:{ sub:"sBTC markets", headline:"What it costs to borrow sBTC, the bitcoin asset used on Stacks.",
             note:"The instrument is sBTC, not native bitcoin. sBTC is redeemable for bitcoin and carries peg and bridge risk that native bitcoin does not. stSTXbtc is collateral only and is excluded." },
        pt:{ sub:"mercados em sBTC", headline:"Quanto custa tomar sBTC emprestado, o ativo bitcoin usado na Stacks.",
             note:"O instrumento é o sBTC, não o bitcoin nativo. O sBTC é resgatável em bitcoin e carrega risco de paridade e de ponte que o bitcoin nativo não tem. O stSTXbtc serve apenas como garantia e fica de fora." }},
  STX:{ en:{ sub:"STX markets", headline:"What money costs in STX, the chain's own collateral.",
             note:"Weights track lending depth in STX and stSTX markets. Liquid staking yield is not a lending rate and is excluded." },
        pt:{ sub:"mercados em STX", headline:"Quanto custa o dinheiro em STX, a garantia da própria rede.",
             note:"Os pesos acompanham a profundidade de crédito dos mercados em STX e stSTX. Rendimento de staking líquido não é taxa de crédito e fica de fora." }}
};

/* ---------------- data (bundled fallback, replaced by api/latest.json) ---------------- */
const INDICES = {
  USD:{ label:"SBOR-USD", markets:[
    { venue:"Zest V2", asset:"USDCx", borrow:2.67, supply:0.76, incentive:0, depth:10.08, phaseIn:1 },
    { venue:"Zest V2", asset:"USDh",  borrow:2.68, supply:0.00, incentive:0, depth: 0.44, phaseIn:1 }]},
  BTC:{ label:"SBOR-BTC", markets:[
    { venue:"Zest V2", asset:"sBTC",  borrow:1.36, supply:0.00, incentive:1.00, depth:52.48, phaseIn:1 }]},
  STX:{ label:"SBOR-STX", markets:[
    { venue:"Zest V2", asset:"STX",   borrow:2.46, supply:1.32, incentive:0,    depth:2.48, phaseIn:1 },
    { venue:"Zest V2", asset:"stSTX", borrow:1.11, supply:0.06, incentive:5.06, depth:2.71, phaseIn:1 }]}
};

let lang = "en", current = "USD", currentRange = 90, fixingDate = "2026-09-01";
try { const s = localStorage.getItem("sbor-lang"); if (s === "pt" || s === "en") lang = s; } catch {}

const T = () => I18N[lang];
const fmt = n => Number(n).toFixed(2);
const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

function computed(key){
  const ix = INDICES[key];
  const raw = ix.markets.map(m => m.depth * m.phaseIn);
  const sum = raw.reduce((a,b)=>a+b,0);
  const ms = ix.markets.map((m,i)=>({ ...m, weight: raw[i]/sum }));
  return { label: ix.label, markets: ms,
    borrow: ms.reduce((a,m)=>a+m.borrow*m.weight,0),
    supply: ms.reduce((a,m)=>a+m.supply*m.weight,0),
    allInSupply: ms.reduce((a,m)=>a+(m.supply+(m.incentive||0))*m.weight,0) };
}

let HISTORY = [];   /* filled by boot() from api/v1/history.json */
let POX = null;     /* filled by boot() from api/v1/latest.json */

const movingAvg = (arr,w) => arr.map((_,i)=>{
  const win = arr.slice(Math.max(0,i-w+1), i+1);
  if (win.length < w || win.some(v => v == null)) return null;
  return win.reduce((a,b)=>a+b,0)/win.length;
});

/* Rows for the selected index and range, oldest first. */
function seriesFor(label, days){
  const cutoff = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  return HISTORY.filter(r => r.date >= cutoff && r[label])
                .map(r => ({ date:r.date, backfilled:!!r.backfilled,
                             borrow:r[label].borrow, supply:r[label].supply }));
}

const chart = document.getElementById("chart");
function draw(){
  const t = T(), label = INDICES[current].label, days = currentRange;
  const rows = seriesFor(label, days);
  const W=1120,H=280,PL=58,PR=14,PT=18,PB=26;

  if (rows.length < 2){
    chart.innerHTML =
      `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="IBM Plex Sans" `+
      `font-size="14" fill="#5C646B">${t.notEnough}</text>`;
    set("chartNote", "");
    return;
  }

  const b = rows.map(r => r.borrow);
  const sp = rows.map(r => r.supply);
  const ma = movingAvg(b.map(v => v == null ? null : v), 30);
  const vals = [...b, ...sp].filter(v => v != null);
  const span = (Math.max(...vals)-Math.min(...vals)) || 1;
  const lo = Math.min(...vals)-span*0.25, hi = Math.max(...vals)+span*0.25;
  const x = i => PL + i*(W-PL-PR)/(rows.length-1);
  const y = v => PT + (hi-v)*(H-PT-PB)/(hi-lo);
  const path = arr => { let d="",pen=false;
    arr.forEach((v,i)=>{ if(v==null){pen=false;return;}
      d += (pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" "; pen=true; });
    return d.trim(); };

  let g = "";
  /* shade the backfilled span so it is never mistaken for live record */
  const lastBf = rows.reduce((acc,r,i) => r.backfilled ? i : acc, -1);
  if (lastBf >= 0){
    g += `<rect x="${PL}" y="${PT}" width="${(x(lastBf)-PL).toFixed(1)}" `+
         `height="${H-PT-PB}" fill="#E7E9E1"/>`;
  }
  for (let k=0;k<=4;k++){
    const v = lo+(hi-lo)*k/4, yy = y(v);
    g += `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="#DEE1D8"/>`;
    g += `<text x="${PL-10}" y="${yy+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" fill="#5C646B">${v.toFixed(1)}%</text>`;
  }
  g += `<text x="${PL}" y="${H-8}" font-family="IBM Plex Mono" font-size="11" fill="#5C646B">${rows[0].date}</text>`;
  g += `<text x="${W-PR}" y="${H-8}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" fill="#5C646B">${rows[rows.length-1].date}</text>`;
  if (ma.some(v => v != null))
    g += `<path d="${path(ma)}" fill="none" stroke="#A2452F" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g += `<path d="${path(sp)}" fill="none" stroke="#5C646B" stroke-width="1.5"/>`;
  g += `<path d="${path(b)}" fill="none" stroke="#1D4E6B" stroke-width="2"/>`;
  chart.innerHTML = g;

  const bf = rows.filter(r => r.backfilled).length;
  set("chartNote", bf ? t.backfillNote(bf, rows.length) : "");
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function settle(el, target){
  if (reduce){ el.textContent = fmt(target); return; }
  const t0 = performance.now(), D = 700;
  (function step(t){
    const k = Math.min(1,(t-t0)/D), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(target*e);
    if (k<1) requestAnimationFrame(step);
  })(t0);
}

function renderChrome(){
  const t = T();
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  set("t-fullname", t.fullname);
  set("t-introH", t.introH); set("t-introP", t.introP); set("t-introUse", t.introUse);
  set("t-borrow-k", t.borrowK); set("t-supply-k", t.supplyK);
  set("t-hist-h", t.histH); set("t-hist-p", t.histP);
  set("t-poxH", t.poxH); set("t-poxP", t.poxP);
  const psec = document.getElementById("pox-sec");
  if (POX){
    psec.hidden = false;
    document.getElementById("poxVal").textContent = POX.apy.toFixed(2);
    set("poxMeta", t.poxMeta(POX.cycle, POX.btcPaid.toFixed(3),
        POX.stxLocked.toLocaleString(lang === "pt" ? "pt-BR" : "en-US")));
  } else { psec.hidden = true; }
  set("t-cons-h", t.consH); set("t-cons-foot", t.consFoot);
  set("t-method-h", t.methodH);
  set("t-signup-h", t.signupH); set("t-signup-p", t.signupP);
  set("t-oracle-a", t.oracleA); set("t-oracle-b", t.oracleB);
  set("t-disclaimer", t.disclaimer);
  document.getElementById("t-signup-btn").textContent = t.signupBtn;
  document.getElementById("email").placeholder = t.signupPlaceholder;
  set("legend", [
    `<span><i class="swatch" style="background:#1D4E6B"></i>${t.legend[0]}</span>`,
    `<span><i class="swatch" style="background:#5C646B"></i>${t.legend[1]}</span>`,
    `<span><i class="swatch" style="background:#A2452F"></i>${t.legend[2]}</span>`].join(""));
  set("thead", t.thead.map((h,i)=>
    i===0 ? `<th>${h}</th>`
    : i===3||i===4 ? `<th class="r hide-sm">${h}</th>`
    : i===6 ? `<th class="r hide-sm" style="width:170px"></th>`
    : `<th class="r">${h}</th>`).join(""));
  const F = '<div class="formula">SBOR(borrow) = Σ wᵢ·rᵢ / Σ wᵢ<br>SBOR(supply) = Σ wᵢ·sᵢ / Σ wᵢ</div>';
  set("method-a", t.methodA.map(p => p==="FORMULA" ? F : `<p>${p}</p>`).join(""));
  set("method-b", t.methodB.map(p => `<p>${p}</p>`).join(""));
  set("switch", Object.keys(INDICES).map(k=>`
    <button data-k="${k}" aria-pressed="${k===current}">
      <b>${INDICES[k].label}</b><small>${INDEX_COPY[k][lang].sub}</small>
    </button>`).join(""));
  document.querySelectorAll("#lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang));
}

function render(){
  const ix = computed(current), t = T(), c = INDEX_COPY[current][lang];
  set("hl", c.headline);
  set("stamp", t.stamp(fixingDate));
  set("consNote", c.note);
  const venues = new Set(ix.markets.map(m => m.venue)).size;
  const largest = Math.max(...ix.markets.map(m => m.weight));
  set("coverage", t.coverage(venues, (largest*100).toFixed(0)));
  settle(document.getElementById("borrowVal"), ix.borrow);
  settle(document.getElementById("supplyVal"), ix.supply);
  set("rows", ix.markets.map(m=>`
    <tr>
      <td><span class="venue">${m.venue}</span><span class="asset">${m.asset}</span></td>
      <td class="r num">${fmt(m.borrow)}%</td>
      <td class="r num">${fmt(m.supply)}%</td>
      <td class="r num hide-sm">${m.incentive ? "+"+fmt(m.incentive)+"%" : "&mdash;"}</td>
      <td class="r num hide-sm">$${m.depth.toFixed(2)}M</td>
      <td class="r num">${(m.weight*100).toFixed(1)}%</td>
      <td class="r hide-sm"><span class="bar${m.phaseIn<1?" phase":""}"><i style="width:${(m.weight*100).toFixed(1)}%"></i></span></td>
    </tr>`).join(""));
  draw();
}

document.getElementById("lang").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("sbor-lang", lang); } catch {}
  renderChrome(); render();
});
document.getElementById("switch").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  current = b.dataset.k;
  document.querySelectorAll("#switch button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});
document.querySelectorAll(".ranges button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".ranges button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    currentRange = +b.dataset.range; draw();
  });
});

async function boot(){
  try{
    const r = await fetch("/api/latest.json", { cache:"no-store" });
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    const map = { "SBOR-USD":"USD", "SBOR-BTC":"BTC", "SBOR-STX":"STX" };
    for (const [label, ix] of Object.entries(d.indices || {})){
      const k = map[label]; if(!k || !INDICES[k]) continue;
      INDICES[k].markets = ix.markets.map(m => ({
        venue:m.venue, asset:m.asset, borrow:m.borrow, supply:m.supply,
        incentive:m.protocolYield || 0, depth:(m.depthUsd||0)/1e6, phaseIn:m.phaseIn ?? 1
      }));
    }
    if (d.fixing) fixingDate = d.fixing.slice(0,10);
    if (d.poxReference) POX = d.poxReference;
  }catch(e){ console.warn("Live fixing unavailable, showing bundled snapshot.", e); }
  try{
    const h = await fetch("/api/v1/history.json", { cache:"no-store" });
    if (h.ok) HISTORY = await h.json();
  }catch(e){ console.warn("Live fixing unavailable, showing bundled snapshot.", e); }
  renderChrome(); render();
}
boot();
</script>
