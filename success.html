<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribed · SBOR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F2ED;--ink:#131A1F;--ink-soft:#5C646B;--rule:#CBCFC4;--rule-soft:#DEE1D8;--accent:#1D4E6B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px;width:100%}
header{border-bottom:1px solid var(--rule)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0;flex-wrap:wrap}
.head-id{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.mark{font-weight:600;font-size:22px;letter-spacing:.16em}
.mark span{color:var(--accent)}
.fullname{font-size:clamp(17px,2vw,21px);font-weight:450}
.lang{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lang button{font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.04em;background:none;border:none;color:var(--ink-soft);padding:5px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{flex:1;display:flex;align-items:center;padding:64px 0}
.card{border:1px solid var(--rule);padding:40px 38px;max-width:640px;
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px)}
h1{font-size:clamp(24px,3.4vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.15}
.card p{color:var(--ink-soft);margin-top:14px;max-width:52ch}
.back{display:inline-block;margin-top:26px;font-size:15px;font-weight:500;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.back:hover{color:var(--ink)}
footer{border-top:1px solid var(--rule);padding:22px 0 40px;color:var(--ink-soft);font-size:13.5px}
@media (max-width:720px){.wrap{padding:0 20px}.card{padding:30px 24px}}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="head-id">
      <div class="mark">S<span>·</span>B<span>·</span>O<span>·</span>R</div>
      <div class="fullname" id="t-fullname"></div>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="pt" aria-pressed="false">PT</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <h1 id="t-h1"></h1>
      <p id="t-p1"></p>
      <p id="t-p2"></p>
      <a class="back" href="/" id="t-back"></a>
    </div>
  </div>
</main>

<footer><div class="wrap"><span id="t-foot"></span></div></footer>

<script>
const C = {
  en:{
    fullname:"Stacks Bitcoin Offered Rate",
    h1:"You are subscribed.",
    p1:"The weekly rate report arrives Monday mornings: where each currency fixed, how the spread moved over the week, and any change to constituents.",
    p2:"One email a week. Nothing else, and no forwarding of your address.",
    back:"Back to the rates",
    foot:"SBOR is published as a public good. Free to reference, no permission required."
  },
  pt:{
    fullname:"Taxa de Referência de Bitcoin da Stacks",
    h1:"Inscrição confirmada.",
    p1:"O relatório semanal chega nas manhãs de segunda: onde cada moeda fechou, como o spread se moveu na semana e qualquer mudança nos componentes.",
    p2:"Um e-mail por semana. Nada além disso, e seu endereço não é repassado a ninguém.",
    back:"Voltar para as taxas",
    foot:"O SBOR é publicado como bem público. Livre para referência, sem necessidade de permissão."
  }
};
let lang = "en";
try { const s = localStorage.getItem("sbor-lang"); if (s === "pt" || s === "en") lang = s; } catch {}
function paint(){
  const t = C[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = (lang === "pt" ? "Inscrito" : "Subscribed") + " · SBOR";
  for (const k of ["fullname","h1","p1","p2","back","foot"])
    document.getElementById("t-"+k).textContent = t[k];
  document.querySelectorAll("#lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang));
}
document.getElementById("lang").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("sbor-lang", lang); } catch {}
  paint();
});
paint();
</script>
</body>
</html>
