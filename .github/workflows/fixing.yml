name: SBOR daily fixing

on:
  schedule:
    - cron: "0 11 * * *"     # 11:00 UTC, noon in London, the hour LIBOR fixed for decades
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute fixing
        env:
          # Every scheduled run is the daily fixing.
          # Manual runs count too, so you can force one when testing.
          SBOR_FIXING: "1"
        run: node scripts/fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name  "sbor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A api latest.txt
          if git diff --staged --quiet; then
            echo "No change, nothing to commit."
          else
            git commit -m "fixing $(date -u +%Y-%m-%d) [skip netlify]"
            git push
          fi
